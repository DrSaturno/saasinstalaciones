project_id = "instalapro"

[db]
port = 54322
shadow_port = 54320
# Debe coincidir con producción: los proyectos hosted corren Postgres 17.
# Con 15 acá, las migraciones se validaban en local y en CI contra una major
# distinta de la que las ejecuta de verdad (OPS-17 de la auditoría de producción).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]

# Segundo factor TOTP (SEC-13). El CLI lo trae deshabilitado por defecto, así
# que sin esto `auth.mfa.enroll` falla en local/CI y el enrolamiento obligatorio
# de admin/gerencia no se puede probar. El proyecto hosted (Demo/prod) ya lo
# tiene habilitado a nivel proyecto.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
