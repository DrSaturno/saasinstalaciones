packages:
  - "."

# Turbopack no resuelve bien los symlinks anidados en Windows + OneDrive.
nodeLinker: hoisted

# Dependencias nativas requeridas por Next/Vitest. Pnpm 11 bloquea cualquier
# script de instalacion que no este aprobado explicitamente.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

# Overrides de seguridad para dependencias transitivas. Pnpm 11 lee esta
# configuracion desde el workspace, no desde `package.json#pnpm`.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
  "@hono/node-server": ">=2.0.5"

minimumReleaseAgeExclude:
  - '@next/env@16.3.5'
  - '@next/eslint-plugin-next@16.3.5'
  - '@next/swc-darwin-arm64@16.3.5'
  - '@next/swc-darwin-x64@16.3.5'
  - '@next/swc-linux-arm64-gnu@16.3.5'
  - '@next/swc-linux-arm64-musl@16.3.5'
  - '@next/swc-linux-x64-gnu@16.3.5'
  - '@next/swc-linux-x64-musl@16.3.5'
  - '@next/swc-win32-arm64-msvc@16.3.5'
  - '@next/swc-win32-x64-msvc@16.3.5'
  - eslint-config-next@16.3.5
  - next@16.3.5
