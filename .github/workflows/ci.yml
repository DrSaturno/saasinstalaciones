name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # Informativo, no bloqueante (OPS-20). La auditoría de seguridad dejó 6
      # vulnerabilidades high aceptadas como residuales: son DoS de tiempo de
      # build en transitivas de `next`/`exceljs`, sin exploit en esta app, y
      # forzarlas con overrides saltaba de versión mayor y rompía el framework.
      # Hacerlo bloqueante dejaría el CI permanentemente en rojo y se volvería
      # ruido que nadie mira. Queda visible para detectar lo que SÍ es nuevo.
      - name: Dependency audit (informativo)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      # Guarda contra una regresión concreta: los scripts que borran datos de
      # producción vivían junto a las migraciones, con la misma extensión y sin
      # nada que los distinguiera (OPS-05). Ya se movieron a
      # `supabase/scripts-manuales/`; esto impide que vuelvan a colarse.
      - name: Verificar que no haya SQL suelto en supabase/
        run: |
          sueltos=$(find supabase -maxdepth 1 -name '*.sql' ! -name 'seed.sql' -print)
          if [ -n "$sueltos" ]; then
            echo "::error::Hay scripts .sql sueltos en supabase/. Los manuales van en supabase/scripts-manuales/:"
            echo "$sueltos"
            exit 1
          fi
          echo "OK: supabase/ sólo contiene seed.sql y los directorios esperados."

  database:
    name: Database pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      - name: Start local database and apply migrations
        run: supabase db start

      - name: Run pgTAP suite
        run: supabase test db

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.110.0

      # `supabase start` levanta toda la pila (no sólo la base como el job de
      # pgTAP) porque el E2E necesita Auth para iniciar sesión, y aplica
      # `seed.sql`, de donde salen los actores de cada rol.
      - name: Start Supabase stack with seed
        run: supabase start

      # Las claves de un Supabase local son efímeras y públicas por diseño; se
      # leen de la pila recién levantada en vez de guardarlas como secretos.
      # `sed` saca las comillas: GITHUB_ENV las tomaría como parte del valor.
      - name: Export local Supabase credentials
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | sed 's/"//g' >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      # Comprobar acá que las credenciales sirven Y que un usuario del seed
      # puede iniciar sesión. Sin este paso, cualquier problema de credenciales
      # o de seed aparece nueve minutos después disfrazado de «el login no
      # redirige», que es el síntoma menos informativo posible: así falló la
      # primera corrida de esta suite.
      - name: Verify credentials and seeded login
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan credenciales. Revisar los --override-name contra lo que emite esta versión del CLI:"
            supabase status -o env
            exit 1
          fi
          echo "URL: $NEXT_PUBLIC_SUPABASE_URL"
          code=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"email":"gerente@demo.dev","password":"InstalaPro2026!"}')
          echo "POST /auth/v1/token para gerente@demo.dev → $code"
          if [ "$code" != "200" ]; then
            echo "::error::El usuario del seed no puede iniciar sesión; el E2E no tiene con qué autenticarse."
            cat /tmp/login.json
            echo "--- usuarios en la base ---"
            supabase db query "select email, email_confirmed_at is not null as confirmado from auth.users order by email" 2>/dev/null \
              || echo "(no se pudo consultar auth.users)"
            exit 1
          fi

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build

      - name: Run Playwright suite
        run: pnpm test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
